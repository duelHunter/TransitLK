# Identity, OTP and passenger notifications. Stateless: accounts live in Postgres and the
# notification listener is a Kafka consumer group, so replicas can be added freely (see hpa.yaml).
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: transitlk
spec:
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: transitlk
spec:
  # Left at 1: the HorizontalPodAutoscaler owns the replica count.
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: transitlk
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kubernetes has no depends_on, so wait here instead of crash-looping the JVM.
        - name: wait-for-dependencies
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 kafka:9092; do
                until nc -z "${target%%:*}" "${target##*:}"; do echo "waiting for $target"; sleep 2; done
              done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: user-service
          image: transitlk/user-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: transitlk-config
          env:
            - name: DB_NAME
              value: transitlk_users
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: JWT_SECRET
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65.0
            # Exposes /actuator/health/liveness and /readiness.
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
