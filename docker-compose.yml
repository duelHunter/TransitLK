name: transitlk

services:
  # ---------- Data tier ----------
  postgres:
    image: postgres:16-alpine
    container_name: transitlk-postgres
    environment:
      POSTGRES_USER: transitlk
      POSTGRES_PASSWORD: transitlk
      POSTGRES_DB: transitlk_users
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      # TCP + the real database: the init phase only listens on the unix socket, so a
      # socket-only check reports healthy before dependent services can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U transitlk -d transitlk_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: transitlk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Event backbone ----------
  kafka:
    # Official Apache image (the bitnami/kafka tags are no longer published on Docker Hub).
    image: apache/kafka:3.7.0
    container_name: transitlk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: transitlk-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ---------- Edge tier ----------
  kong:
    image: kong:3.7
    container_name: transitlk-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000" # proxy (this is what clients/web-portal call)
      - "8001:8001" # admin API
    depends_on:
      - user-service
      - ticketing-service
      - tracking-service

  # ---------- Microservices tier ----------
  user-service:
    build: ./services/user-service
    container_name: transitlk-user-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transitlk_users
      DB_USER: transitlk
      DB_PASSWORD: transitlk
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: transitlk-dev-secret-key-change-me-please-32bytes+
      JWT_EXPIRATION_SECONDS: 3600
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ticketing-service:
    build: ./services/ticketing-service
    container_name: transitlk-ticketing-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transitlk_ticketing
      DB_USER: transitlk
      DB_PASSWORD: transitlk
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: transitlk-dev-secret-key-change-me-please-32bytes+
      TICKET_SIGNING_SECRET: transitlk-ticket-signing-secret-32bytes-min
      TRACKING_TOKEN_SECRET: transitlk-tracking-token-secret-32bytes-min
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tracking-service:
    build: ./services/tracking-service
    container_name: transitlk-tracking-service
    environment:
      PORT: 8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_URL: mqtt://mosquitto:1883
      JWT_SECRET: transitlk-dev-secret-key-change-me-please-32bytes+
      TRACKING_TOKEN_SECRET: transitlk-tracking-token-secret-32bytes-min
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ---------- Client tier ----------
  web-portal:
    build:
      context: ./web-portal
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_URL: http://localhost:8083
    container_name: transitlk-web-portal
    ports:
      - "3000:80"
    depends_on:
      - kong

volumes:
  postgres-data:
  kafka-data:
