server:
  port: 8082

spring:
  application:
    name: ticketing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transitlk_ticketing}
    username: ${DB_USER:transitlk}
    password: ${DB_PASSWORD:transitlk}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

transitlk:
  jwt:
    secret: ${JWT_SECRET:transitlk-dev-secret-key-change-me-please-32bytes+}
  ticket:
    signing-secret: ${TICKET_SIGNING_SECRET:transitlk-ticket-signing-secret-32bytes-min}
  tracking:
    token-secret: ${TRACKING_TOKEN_SECRET:transitlk-tracking-token-secret-32bytes-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
