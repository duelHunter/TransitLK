# GPS ingestion (MQTT and REST), live positions in Redis, WebSocket push, ETA.
#
# ONE REPLICA ON PURPOSE. Each pod keeps its WebSocket rooms in memory, so with several pods a ping
# ingested by pod A would never reach a client connected to pod B. To scale this service out it needs
# the Socket.IO Redis adapter (so pods share rooms) and sticky sessions on the gateway first.
# There is deliberately no HorizontalPodAutoscaler for it, and check_manifests.py enforces that.
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  labels:
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/part-of: transitlk
spec:
  selector:
    app.kubernetes.io/name: tracking-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  labels:
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/part-of: transitlk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracking-service
        app.kubernetes.io/part-of: transitlk
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The Kafka producer only tries to connect once at start-up, so Kafka must already be up.
        - name: wait-for-dependencies
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              for target in redis:6379 kafka:9092; do
                until nc -z "${target%%:*}" "${target##*:}"; do echo "waiting for $target"; sleep 2; done
              done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: tracking-service
          image: transitlk/tracking-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: transitlk-config
          env:
            - name: PORT
              value: "8083"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: JWT_SECRET
            - name: TRACKING_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: TRACKING_TOKEN_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
