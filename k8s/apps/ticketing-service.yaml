# Routes, trips, booking, QR tickets, operator reports. Stateless (state is in Postgres), so it can be
# autoscaled (see hpa.yaml). The demo data seeder runs at start-up and skips routes that already exist.
apiVersion: v1
kind: Service
metadata:
  name: ticketing-service
  labels:
    app.kubernetes.io/name: ticketing-service
    app.kubernetes.io/part-of: transitlk
spec:
  selector:
    app.kubernetes.io/name: ticketing-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-service
  labels:
    app.kubernetes.io/name: ticketing-service
    app.kubernetes.io/part-of: transitlk
spec:
  # Left at 1: the HorizontalPodAutoscaler owns the replica count, and a single first pod avoids two
  # pods seeding the demo routes at the same moment.
  selector:
    matchLabels:
      app.kubernetes.io/name: ticketing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticketing-service
        app.kubernetes.io/part-of: transitlk
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 kafka:9092; do
                until nc -z "${target%%:*}" "${target##*:}"; do echo "waiting for $target"; sleep 2; done
              done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: ticketing-service
          image: transitlk/ticketing-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: transitlk-config
          env:
            - name: DB_NAME
              value: transitlk_ticketing
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: JWT_SECRET
            - name: TICKET_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: TICKET_SIGNING_SECRET
            - name: TRACKING_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: transitlk-secrets
                  key: TRACKING_TOKEN_SECRET
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65.0
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
